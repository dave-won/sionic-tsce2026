name: Close event page after 2026-11-25
on:
  schedule:
    - cron: "0 17 25 11 *"   # 2026-11-26 00:00 Bangkok
  workflow_dispatch:
permissions:
  contents: write
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace page and remove PDF
        run: |
          if [ "$(date -u +%Y)" != "2026" ] && [ "${{ github.event_name }}" = "schedule" ]; then exit 0; fi
          cp closed.html index.html
          git rm -f --ignore-unmatch Sionic_AI_Introduction_en.pdf
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Close TSCE 2026 event page" || exit 0
          git push
